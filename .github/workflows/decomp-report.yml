name: ByteMatch report

on:
  push:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate objdiff-compatible report
        run: |
          python3 scripts/generate_decomp_report.py \
            --output build/report.json
      - name: Validate report measures
        run: python3 scripts/validate_decomp_report.py --report build/report.json
      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: jp_rev1_report
          path: build/report.json
